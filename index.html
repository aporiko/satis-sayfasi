<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gruntech Solar - Ekipman Marketi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .active-cat { background-color: #ea580c !important; color: white !important; border-color: #ea580c !important; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <nav class="sticky top-0 z-50 bg-white shadow-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex-shrink-0 flex items-center gap-2">
                    <div class="w-10 h-10 bg-orange-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">G</div>
                    <div>
                        <span class="text-2xl font-black text-slate-900 tracking-tight">GRÜNTECH</span>
                        <span class="text-xs block text-orange-600 font-bold uppercase tracking-widest">Solar Market</span>
                    </div>
                </div>

                <div class="flex items-center">
                    <button onclick="toggleCart()" class="relative group bg-orange-50 p-3 rounded-xl hover:bg-orange-100 transition-all duration-300">
                        <i class="fa-solid fa-cart-shopping text-orange-600 text-xl group-hover:scale-110 transition-transform"></i>
                        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs font-bold h-6 w-6 flex items-center justify-center rounded-full border-2 border-white shadow-sm">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="bg-slate-900 text-white py-12 px-6 text-center bg-[url('https://images.unsplash.com/photo-1509391366360-2e959784a276?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80')] bg-cover bg-center bg-blend-overlay">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4 tracking-tight">Güneş Enerjisi Ekipmanları</h1>
        <p class="text-lg text-slate-300 max-w-2xl mx-auto">Projeleriniz için en kaliteli panel, inverter ve montaj ekipmanlarını buradan seçip teklif alabilirsiniz.</p>
    </div>

    <div class="bg-white border-b sticky top-20 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 overflow-x-auto scrollbar-hide flex gap-3">
            <button onclick="filterProducts('Tümü')" class="cat-btn active-cat whitespace-nowrap px-6 py-2.5 rounded-full bg-slate-100 text-slate-600 font-bold text-sm border border-slate-200 hover:bg-slate-200 transition-colors">Tümü</button>
            <button onclick="filterProducts('Panel')" class="cat-btn whitespace-nowrap px-6 py-2.5 rounded-full bg-slate-100 text-slate-600 font-bold text-sm border border-slate-200 hover:bg-slate-200 transition-colors">Güneş Panelleri</button>
            <button onclick="filterProducts('İnverter')" class="cat-btn whitespace-nowrap px-6 py-2.5 rounded-full bg-slate-100 text-slate-600 font-bold text-sm border border-slate-200 hover:bg-slate-200 transition-colors">İnverterler</button>
            <button onclick="filterProducts('Akü')" class="cat-btn whitespace-nowrap px-6 py-2.5 rounded-full bg-slate-100 text-slate-600 font-bold text-sm border border-slate-200 hover:bg-slate-200 transition-colors">Akü & Depolama</button>
            <button onclick="filterProducts('Montaj')" class="cat-btn whitespace-nowrap px-6 py-2.5 rounded-full bg-slate-100 text-slate-600 font-bold text-sm border border-slate-200 hover:bg-slate-200 transition-colors">Montaj & Kablo</button>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            </div>
    </main>

    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/50 z-[60] hidden transition-opacity"></div>
    
    <div id="cart-sidebar" class="fixed right-0 top-0 h-full w-full sm:w-[450px] bg-white shadow-2xl z-[70] transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-6 border-b flex justify-between items-center bg-slate-50">
            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-clipboard-list text-orange-600"></i> Talep Listesi
            </h2>
            <button onclick="toggleCart()" class="text-slate-400 hover:text-red-500 transition-colors p-2">
                <i class="fa-solid fa-xmark text-2xl"></i>
            </button>
        </div>

        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4 bg-white">
            <div class="text-center text-gray-400 mt-10">Listeniz henüz boş.</div>
        </div>

        <div class="border-t p-6 bg-slate-50">
            <div class="flex justify-between items-center mb-6">
                <span class="text-gray-500 font-medium">Tahmini Toplam:</span>
                <span id="total-price" class="text-2xl font-black text-slate-900">0 TL</span>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Adınız Soyadınız</label>
                    <input type="text" id="cust-name" class="w-full border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 border shadow-sm" placeholder="Örn: Ahmet Yılmaz">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Telefon Numaranız</label>
                    <input type="tel" id="cust-tel" class="w-full border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 border shadow-sm" placeholder="Örn: 0532 123 45 67">
                </div>
                
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button id="btn-satin-al" onclick="checkout('Satın Alma')" class="bg-slate-900 hover:bg-slate-800 text-white py-3.5 rounded-xl font-bold transition-colors shadow-lg flex justify-center items-center gap-2">
                        <span>Satın Al</span>
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                    <button id="btn-teklif-al" onclick="checkout('Teklif')" class="bg-orange-600 hover:bg-orange-700 text-white py-3.5 rounded-xl font-bold transition-colors shadow-lg flex justify-center items-center gap-2">
                        <span>Fiyat Sor</span>
                        <i class="fa-regular fa-envelope"></i>
                    </button>
                </div>
                <p class="text-xs text-center text-gray-400 mt-2">Talebiniz bize ulaştığında en kısa sürede aranacaksınız.</p>
            </div>
        </div>
    </div>

    <script>
        // --- AYARLAR ---
        // LÜTFEN AŞAĞIDAKİ ADRESİ KENDİ GOOGLE APPS SCRIPT ADRESİNİZLE DEĞİŞTİRİN
        const scriptURL = 'https://docs.google.com/spreadsheets/d/13dqT6dV_fwZt1lGcOc8ePLnWcrSmh3Gj5r1sLAfKGl4/edit?gid=0#gid=0'; 

        // --- ÜRÜN VERİLERİ ---
        // Buraya istediğiniz kadar ürün ekleyebilirsiniz.
        // category seçenekleri: 'Panel', 'İnverter', 'Akü', 'Montaj' (Yukarıdaki buton isimleriyle aynı olmalı)
        const products = [
            { 
                id: 1, 
                name: "550W Half-Cut Monokristal Panel", 
                category: "Panel", 
                price: 4250, 
                img: "https://images.unsplash.com/photo-1592833159155-c62df1b65634?auto=format&fit=crop&w=500&q=80", 
                desc: "Yüksek verimli, gölge toleranslı A sınıfı hücre yapısı." 
            },
            { 
                id: 2, 
                name: "455W Perc Monokristal Panel", 
                category: "Panel", 
                price: 3800, 
                img: "https://images.unsplash.com/photo-1613665813446-82a78c468a1d?auto=format&fit=crop&w=500&q=80", 
                desc: "Standart projeler için ideal fiyat/performans ürünü." 
            },
            { 
                id: 3, 
                name: "10kW On-Grid İnverter", 
                category: "İnverter", 
                price: 32000, 
                img: "https://images.unsplash.com/photo-1620288627223-537a2b2f6723?auto=format&fit=crop&w=500&q=80", 
                desc: "3 Fazlı, Wi-Fi özellikli, 10 yıl garantili." 
            },
            { 
                id: 4, 
                name: "5kW Hibrit İnverter", 
                category: "İnverter", 
                price: 28500, 
                img: "https://images.unsplash.com/photo-1558449028-b53a39d100fc?auto=format&fit=crop&w=500&q=80", 
                desc: "Hem şebeke hem akü ile çalışabilen akıllı inverter." 
            },
            { 
                id: 5, 
                name: "100Ah Jel Akü", 
                category: "Akü", 
                price: 6500, 
                img: "https://images.unsplash.com/photo-1619641604085-300438a221f7?auto=format&fit=crop&w=500&q=80", 
                desc: "Derin döngülü, uzun ömürlü solar jel akü." 
            },
            { 
                id: 6, 
                name: "6mm Solar Kablo (Siyah/Kırmızı)", 
                category: "Montaj", 
                price: 45, 
                img: "https://images.unsplash.com/photo-1544724569-5f546fd6dd2d?auto=format&fit=crop&w=500&q=80", 
                desc: "UV dayanımlı, çift izoleli solar kablo (Metre fiyatı)." 
            },
             { 
                id: 7, 
                name: "MC4 Konnektör Seti", 
                category: "Montaj", 
                price: 85, 
                img: "https://images.unsplash.com/photo-1620288627223-537a2b2f6723?auto=format&fit=crop&w=500&q=80", 
                desc: "Su geçirmez IP67 bağlantı konnektörü." 
            }
        ];

        // --- SİSTEM DEĞİŞKENLERİ ---
        let cart = [];
        let currentCategory = 'Tümü';

        // --- FONKSİYONLAR ---

        // 1. Ürünleri Ekrana Basma
        function renderProducts(productList) {
            const grid = document.getElementById('product-grid');
            
            if(productList.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400">Bu kategoride ürün bulunamadı.</div>';
                return;
            }

            grid.innerHTML = productList.map(p => `
                <div class="group bg-white rounded-2xl shadow-sm border border-gray-100 hover:shadow-xl hover:border-orange-100 transition-all duration-300 overflow-hidden flex flex-col">
                    <div class="relative h-48 overflow-hidden">
                        <img src="${p.img}" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-bold text-orange-600 uppercase tracking-wider shadow-sm">
                            ${p.category}
                        </div>
                    </div>
                    
                    <div class="p-5 flex-1 flex flex-col">
                        <h3 class="font-bold text-slate-800 text-lg mb-2 leading-tight min-h-[3rem]">${p.name}</h3>
                        <p class="text-gray-400 text-sm mb-4 line-clamp-2">${p.desc}</p>
                        
                        <div class="mt-auto flex justify-between items-center pt-4 border-t border-gray-50">
                            <span class="text-xl font-black text-slate-900">${p.price.toLocaleString('tr-TR')} ₺</span>
                            <button onclick="addToCart(${p.id})" class="bg-slate-100 text-slate-700 w-10 h-10 rounded-full flex items-center justify-center hover:bg-orange-600 hover:text-white transition-colors shadow-sm active:scale-95">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 2. Kategori Filtreleme
        function filterProducts(category) {
            currentCategory = category;
            
            // Buton stillerini güncelle
            const buttons = document.querySelectorAll('.cat-btn');
            buttons.forEach(btn => {
                if(btn.innerText.includes(category) || (category === 'Tümü' && btn.innerText === 'Tümü')) {
                    btn.classList.add('active-cat');
                    btn.classList.remove('bg-slate-100', 'text-slate-600');
                } else {
                    btn.classList.remove('active-cat');
                    btn.classList.add('bg-slate-100', 'text-slate-600');
                }
            });

            // Listeyi filtrele ve çiz
            if (category === 'Tümü') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.category.includes(category) || p.category === category);
                renderProducts(filtered);
            }
        }

        // 3. Sepete Ekleme
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCart();
            
            // Sepeti otomatik aç (UX için)
            const sidebar = document.getElementById('cart-sidebar');
            if(sidebar.classList.contains('translate-x-full')) {
                toggleCart();
            }
        }

        // 4. Sepetten Çıkarma
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        // 5. Sepeti Güncelleme
        function updateCart() {
            // Sayaç güncelle
            document.getElementById('cart-count').innerText = cart.length;

            // Liste güncelle
            const itemsContainer = document.getElementById('cart-items');
            if (cart.length === 0) {
                itemsContainer.innerHTML = '<div class="flex flex-col items-center justify-center h-full text-gray-400 gap-4"><i class="fa-solid fa-basket-shopping text-4xl opacity-20"></i><p>Sepetiniz şu an boş.</p></div>';
            } else {
                itemsContainer.innerHTML = cart.map((p, index) => `
                    <div class="flex gap-4 items-center bg-slate-50 p-3 rounded-xl border border-gray-100 animate-[fadeIn_0.3s_ease-out]">
                        <img src="${p.img}" class="w-16 h-16 object-cover rounded-lg bg-white">
                        <div class="flex-1">
                            <div class="font-bold text-sm text-slate-800 line-clamp-1">${p.name}</div>
                            <div class="text-orange-600 font-bold text-sm">${p.price.toLocaleString('tr-TR')} ₺</div>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-full transition-colors">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `).join('');
            }

            // Toplam Tutar Hesapla
            const total = cart.reduce((sum, p) => sum + p.price, 0);
            document.getElementById('total-price').innerText = total.toLocaleString('tr-TR') + ' TL';
        }

        // 6. Sepeti Aç/Kapa
        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            
            sidebar.classList.toggle('translate-x-full');
            
            if (sidebar.classList.contains('translate-x-full')) {
                overlay.classList.add('hidden');
                document.body.style.overflow = 'auto'; // Sayfa kaydırmayı aç
            } else {
                overlay.classList.remove('hidden');
                document.body.style.overflow = 'hidden'; // Sayfa kaydırmayı kilitle
            }
        }

        // 7. Satın Alma / Gönderme İşlemi
        function checkout(type) {
            const name = document.getElementById('cust-name').value.trim();
            const tel = document.getElementById('cust-tel').value.trim();
            const btnSatin = document.getElementById('btn-satin-al');
            const btnTeklif = document.getElementById('btn-teklif-al');

            // Kontroller
            if(cart.length === 0) { alert('Sepetiniz boş.'); return; }
            if(!name || !tel) { alert('Lütfen Ad Soyad ve Telefon bilgilerinizi giriniz.'); return; }
            if(scriptURL.includes('BURAYA')) { alert('Lütfen Google Sheets URL adresini koda ekleyin!'); return; }

            // Butonları kilitle
            btnSatin.disabled = true;
            btnTeklif.disabled = true;
            btnSatin.innerText = 'Gönderiliyor...';

            // Ürün Listesini Hazırla (Google Sheets'e gidecek format)
            // Örnek: "Panel (4000 TL), İnverter (20000 TL)"
            const urunListesiMetni = cart.map(p => `${p.name} (${p.price} TL)`).join(', \n');

            const orderData = {
                isim: name,
                telefon: tel,
                tur: type,
                urunler: urunListesiMetni, // DÜZELTİLEN KISIM BURASI
                toplam: document.getElementById('total-price').innerText
            };

            // Gönder
            fetch(scriptURL, { 
                method: 'POST', 
                body: JSON.stringify(orderData)
            })
            .then(response => {
                alert(`Teşekkürler Sayın ${name}!\n\n${type} talebiniz bize ulaştı. Ekibimiz ${tel} numarasından size dönüş yapacaktır.`);
                
                // Temizlik
                cart = [];
                updateCart();
                toggleCart();
                document.getElementById('cust-name').value = '';
                document.getElementById('cust-tel').value = '';
            })
            .catch(error => {
                console.error('Hata:', error);
                alert('Bir hata oluştu. Lütfen daha sonra tekrar deneyin.');
            })
            .finally(() => {
                // Butonları aç
                btnSatin.disabled = false;
                btnTeklif.disabled = false;
                btnSatin.innerHTML = '<span>Satın Al</span><i class="fa-solid fa-chevron-right text-xs"></i>';
            });
        }

        // Başlangıçta tüm ürünleri yükle
        renderProducts(products);

    </script>
</body>
</html>
