<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gruntech Solar - Profesyonel Ekipman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .active-cat { background-color: #ea580c !important; color: white !important; border-color: #ea580c !important; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        /* Galeri Thumbnails */
        .thumb-active { border-color: #ea580c; opacity: 1; }
        .thumb { opacity: 0.6; transition: all 0.2s; }
        .thumb:hover { opacity: 1; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <nav class="sticky top-0 z-40 bg-white/90 backdrop-blur-md shadow-sm border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex-shrink-0 flex items-center gap-2 cursor-pointer" onclick="location.reload()">
                    <div class="w-10 h-10 bg-orange-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">G</div>
                    <div>
                        <span class="text-2xl font-black text-slate-900 tracking-tight">GRÜNTECH</span>
                        <span class="text-xs block text-orange-600 font-bold uppercase tracking-widest">Mühendislik & Satış</span>
                    </div>
                </div>
                <div class="flex items-center">
                    <button onclick="toggleCart()" class="relative group bg-orange-50 p-3 rounded-xl hover:bg-orange-100 transition-all duration-300">
                        <i class="fa-solid fa-cart-shopping text-orange-600 text-xl group-hover:scale-110 transition-transform"></i>
                        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs font-bold h-6 w-6 flex items-center justify-center rounded-full border-2 border-white shadow-sm">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="bg-white border-b sticky top-20 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 overflow-x-auto scrollbar-hide flex gap-3">
            <button onclick="filterProducts('Tümü')" class="cat-btn active-cat whitespace-nowrap px-6 py-2.5 rounded-full bg-slate-100 text-slate-600 font-bold text-sm border border-slate-200 hover:bg-slate-200 transition-colors">Tümü</button>
            <button onclick="filterProducts('Panel')" class="cat-btn whitespace-nowrap px-6 py-2.5 rounded-full bg-slate-100 text-slate-600 font-bold text-sm border border-slate-200 hover:bg-slate-200 transition-colors">Güneş Panelleri</button>
            <button onclick="filterProducts('İnverter')" class="cat-btn whitespace-nowrap px-6 py-2.5 rounded-full bg-slate-100 text-slate-600 font-bold text-sm border border-slate-200 hover:bg-slate-200 transition-colors">İnverterler</button>
            <button onclick="filterProducts('Akü')" class="cat-btn whitespace-nowrap px-6 py-2.5 rounded-full bg-slate-100 text-slate-600 font-bold text-sm border border-slate-200 hover:bg-slate-200 transition-colors">Akü & Depolama</button>
            <button onclick="filterProducts('Montaj')" class="cat-btn whitespace-nowrap px-6 py-2.5 rounded-full bg-slate-100 text-slate-600 font-bold text-sm border border-slate-200 hover:bg-slate-200 transition-colors">Montaj & Kablo</button>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-12 min-h-screen">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            </div>
    </main>

    <div id="product-modal" class="fixed inset-0 z-[60] hidden" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-gray-900/80 transition-opacity backdrop-blur-sm" onclick="closeModal()"></div>

        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-center justify-center p-4 sm:p-0">
                <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all w-full max-w-5xl my-8">
                    
                    <button onclick="closeModal()" class="absolute top-4 right-4 z-20 bg-white/90 rounded-full p-2 hover:bg-red-50 text-gray-500 hover:text-red-500 transition-colors shadow-sm">
                        <i class="fa-solid fa-xmark text-2xl"></i>
                    </button>

                    <div class="grid grid-cols-1 lg:grid-cols-2 h-full">
                        <div class="bg-gray-50 p-6 flex flex-col justify-center h-full">
                            <div class="relative h-80 lg:h-96 w-full mb-4 bg-white rounded-xl shadow-sm border p-2 flex items-center justify-center">
                                <img id="modal-main-img" src="" class="max-h-full max-w-full object-contain">
                            </div>
                            <div id="modal-thumbnails" class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide justify-center">
                                </div>
                        </div>

                        <div class="p-8 lg:p-10 flex flex-col h-full overflow-y-auto max-h-[90vh]">
                            <span id="modal-category" class="text-orange-600 font-bold text-xs uppercase tracking-widest mb-2 bg-orange-50 w-fit px-2 py-1 rounded">KATEGORİ</span>
                            <h3 id="modal-title" class="text-3xl font-black text-slate-900 mb-4 leading-tight">Ürün Adı</h3>
                            
                            <div class="mb-6">
                                <h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2"><i class="fa-solid fa-list-check text-orange-500"></i> Teknik Özellikler</h4>
                                <ul id="modal-desc" class="space-y-2 text-gray-600 text-sm list-disc pl-5 marker:text-orange-400"></ul>
                            </div>

                            <div id="modal-docs-container" class="mb-8 hidden">
                                <h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2"><i class="fa-solid fa-file-arrow-down text-blue-500"></i> Teknik Dokümanlar</h4>
                                <div id="modal-docs" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    </div>
                            </div>

                            <div class="mt-auto pt-6 border-t flex flex-col sm:flex-row items-center gap-6 justify-between">
                                <div>
                                    <div class="text-sm text-gray-400 font-bold">Birim Fiyat</div>
                                    <div class="text-4xl font-black text-slate-900" id="modal-price">0 TL</div>
                                </div>
                                <button id="modal-add-btn" class="w-full sm:w-auto bg-slate-900 hover:bg-orange-600 text-white px-8 py-4 rounded-xl font-bold transition-colors flex items-center justify-center gap-3 shadow-lg hover:shadow-orange-200">
                                    <span>Listeye Ekle</span>
                                    <i class="fa-solid fa-plus bg-white/20 p-1 rounded-full text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/50 z-[70] hidden transition-opacity"></div>
    <div id="cart-sidebar" class="fixed right-0 top-0 h-full w-full sm:w-[450px] bg-white shadow-2xl z-[80] transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-6 border-b flex justify-between items-center bg-slate-50">
            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-clipboard-list text-orange-600"></i> Talep Listesi</h2>
            <button onclick="toggleCart()" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-xmark text-2xl"></i></button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        <div class="border-t p-6 bg-slate-50">
            <div class="flex justify-between items-center mb-6">
                <span class="text-gray-500 font-medium">Tahmini Toplam:</span>
                <span id="total-price" class="text-2xl font-black text-slate-900">0 TL</span>
            </div>
            <div class="space-y-3">
                <input type="text" id="cust-name" class="w-full border-gray-300 rounded-lg p-3 border shadow-sm focus:ring-2 focus:ring-orange-500" placeholder="Ad Soyad">
                <input type="tel" id="cust-tel" class="w-full border-gray-300 rounded-lg p-3 border shadow-sm focus:ring-2 focus:ring-orange-500" placeholder="Telefon">
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button id="btn-satin-al" onclick="checkout('Satın Alma')" class="bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-slate-800">Satın Al</button>
                    <button id="btn-teklif-al" onclick="checkout('Teklif')" class="bg-orange-600 text-white py-3 rounded-xl font-bold hover:bg-orange-700">Fiyat Sor</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- AYARLAR ---
        const scriptURL = 'BURAYA_YENI_APPS_SCRIPT_URL_GELECEK'; // <--- BURAYI UNUTMA!

        let products = [];
        let cart = [];

        document.addEventListener('DOMContentLoaded', () => { fetchProducts(); });

        function fetchProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-500 font-bold animate-pulse">Ürün kataloğu yükleniyor...</div>';

            fetch(scriptURL)
            .then(response => response.json())
            .then(data => {
                products = data;
                renderProducts(products);
            })
            .catch(error => {
                console.error(error);
                grid.innerHTML = '<div class="col-span-full text-center text-red-600 font-bold">Veri hatası. Lütfen sayfayı yenileyin.</div>';
            });
        }

        function renderProducts(list) {
            const grid = document.getElementById('product-grid');
            if(!list || list.length === 0) { grid.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10">Ürün bulunamadı.</div>'; return; }
            
            grid.innerHTML = list.map(p => {
                // Ana resim ilk resimdir, yoksa placeholder
                const mainImg = (p.images && p.images.length > 0) ? p.images[0] : 'https://via.placeholder.com/300?text=Resim+Yok';
                
                return `
                <div class="group bg-white rounded-2xl shadow-sm border border-gray-100 hover:shadow-xl hover:border-orange-100 transition-all duration-300 flex flex-col overflow-hidden">
                    <div class="relative h-56 overflow-hidden cursor-pointer bg-gray-50 p-4" onclick="openModal('${p.id}')">
                        <img src="${mainImg}" class="w-full h-full object-contain transform group-hover:scale-105 transition-transform duration-500 mix-blend-multiply">
                        <div class="absolute bottom-3 right-3 bg-white/90 text-slate-900 px-3 py-1 rounded-full font-bold text-xs shadow-md opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="fa-solid fa-magnifying-glass"></i> İncele
                        </div>
                    </div>
                    <div class="p-5 flex-1 flex flex-col">
                        <span class="text-xs font-bold text-orange-600 uppercase mb-1">${p.category}</span>
                        <h3 class="font-bold text-slate-800 text-lg mb-2 cursor-pointer hover:text-orange-600 transition-colors line-clamp-2" onclick="openModal('${p.id}')">${p.name}</h3>
                        <p class="text-gray-400 text-sm mb-4 line-clamp-2">${p.desc}</p>
                        <div class="mt-auto pt-4 border-t flex justify-between items-center">
                            <span class="text-xl font-black text-slate-900">${Number(p.price).toLocaleString('tr-TR')} ₺</span>
                            <button onclick="addToCart('${p.id}')" class="bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center text-slate-600 hover:bg-orange-600 hover:text-white transition-all shadow-sm active:scale-95">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        // --- GALERİ & DOKÜMAN MODAL ---
        function openModal(id) {
            const product = products.find(p => p.id == id);
            if(!product) return;

            // 1. Galeri Kurulumu
            const mainImg = document.getElementById('modal-main-img');
            const thumbContainer = document.getElementById('modal-thumbnails');
            
            // Eğer hiç resim yoksa placeholder
            const images = (product.images && product.images.length > 0) ? product.images : ['https://via.placeholder.com/400?text=Resim+Yok'];
            
            // İlk resmi ana resim yap
            mainImg.src = images[0];
            
            // Thumbnails oluştur
            thumbContainer.innerHTML = images.map((img, idx) => `
                <img src="${img}" onclick="changeMainImage('${img}', this)" 
                class="thumb w-16 h-16 object-cover rounded-lg border-2 border-transparent cursor-pointer bg-white ${idx===0 ? 'thumb-active' : ''}">
            `).join('');

            // 2. Metin Bilgileri
            document.getElementById('modal-category').innerText = product.category;
            document.getElementById('modal-title').innerText = product.name;
            document.getElementById('modal-price').innerText = Number(product.price).toLocaleString('tr-TR') + ' TL';
            
            let detailsHtml = '';
            if (Array.isArray(product.details)) {
                detailsHtml = product.details.map(item => `<li>${item}</li>`).join('');
            } else {
                detailsHtml = '<li>Ek özellik belirtilmemiş.</li>';
            }
            document.getElementById('modal-desc').innerHTML = detailsHtml;

            // 3. Dokümanlar
            const docContainer = document.getElementById('modal-docs-container');
            const docList = document.getElementById('modal-docs');
            
            if (product.docs && product.docs.length > 0) {
                docContainer.classList.remove('hidden');
                docList.innerHTML = product.docs.map(doc => `
                    <a href="${doc.url}" target="_blank" class="flex items-center gap-3 p-3 rounded-lg border border-gray-200 hover:bg-blue-50 hover:border-blue-200 transition-colors group">
                        <div class="bg-red-100 text-red-600 w-10 h-10 rounded-lg flex items-center justify-center">
                            <i class="fa-regular fa-file-pdf text-xl"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="font-bold text-sm text-slate-800 group-hover:text-blue-700 truncate">${doc.name}</div>
                            <div class="text-xs text-gray-400">Görüntüle / İndir</div>
                        </div>
                        <i class="fa-solid fa-download text-gray-300 group-hover:text-blue-500"></i>
                    </a>
                `).join('');
            } else {
                docContainer.classList.add('hidden');
            }

            // Buton
            document.getElementById('modal-add-btn').onclick = function() { addToCart(product.id); closeModal(); };

            document.getElementById('product-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function changeMainImage(src, thumbElement) {
            document.getElementById('modal-main-img').src = src;
            // Aktif thumb stilini değiştir
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('thumb-active'));
            thumbElement.classList.add('thumb-active');
        }

        function closeModal() {
            document.getElementById('product-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function filterProducts(category) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.innerText.includes(category) || (category === 'Tümü' && btn.innerText === 'Tümü')) {
                    btn.classList.add('active-cat'); btn.classList.remove('bg-slate-100', 'text-slate-600');
                } else {
                    btn.classList.remove('active-cat'); btn.classList.add('bg-slate-100', 'text-slate-600');
                }
            });
            if (category === 'Tümü') renderProducts(products);
            else renderProducts(products.filter(p => p.category === category));
        }

        function addToCart(id) {
            const product = products.find(p => p.id == id);
            cart.push(product);
            updateCart();
            const sidebar = document.getElementById('cart-sidebar');
            if(sidebar.classList.contains('translate-x-full')) toggleCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function updateCart() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items');
            
            if(cart.length === 0) {
                container.innerHTML = '<div class="flex flex-col items-center justify-center h-full text-gray-400 gap-2"><i class="fa-solid fa-basket-shopping text-3xl opacity-20"></i><p>Sepet boş.</p></div>';
            } else {
                container.innerHTML = cart.map((p, index) => {
                    // Sepette de ilk resmi gösterelim
                    const img = (p.images && p.images.length > 0) ? p.images[0] : 'https://via.placeholder.com/50';
                    return `
                    <div class="flex gap-3 items-center bg-slate-50 p-3 rounded-xl border border-gray-100">
                        <img src="${img}" class="w-12 h-12 object-contain rounded bg-white border">
                        <div class="flex-1 min-w-0">
                            <div class="font-bold text-sm text-slate-800 truncate">${p.name}</div>
                            <div class="text-orange-600 font-bold text-xs">${Number(p.price).toLocaleString('tr-TR')} ₺</div>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-gray-400 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `}).join('');
            }
            
            const total = cart.reduce((sum, p) => sum + Number(p.price), 0);
            document.getElementById('total-price').innerText = total.toLocaleString('tr-TR') + ' TL';
        }

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            sidebar.classList.toggle('translate-x-full');
            
            if (sidebar.classList.contains('translate-x-full')) {
                overlay.classList.add('hidden');
                if(document.getElementById('product-modal').classList.contains('hidden')) document.body.style.overflow = 'auto';
            } else {
                overlay.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }
        }

        function checkout(type) {
            const name = document.getElementById('cust-name').value.trim();
            const tel = document.getElementById('cust-tel').value.trim();
            const btn = type === 'Satın Alma' ? document.getElementById('btn-satin-al') : document.getElementById('btn-teklif-al');

            if(cart.length === 0) { alert('Sepetiniz boş.'); return; }
            if(!name || !tel) { alert('Lütfen bilgilerinizi giriniz.'); return; }

            btn.disabled = true; btn.innerText = '...';
            
            const urunListesi = cart.map(p => `${p.name} (${Number(p.price)} TL)`).join(', \n');
            const orderData = { isim: name, telefon: tel, tur: type, urunler: urunListesi, toplam: document.getElementById('total-price').innerText };

            fetch(scriptURL, { 
                method: 'POST', 
                body: JSON.stringify(orderData)
            })
            .then(response => response.json())
            .then(data => {
                alert(`Teşekkürler Sayın ${name}!\n\n${type} talebiniz bize ulaştı. Ekibimiz ${tel} numarasından size dönüş yapacaktır.`);
                cart = []; updateCart(); toggleCart();
                document.getElementById('cust-name').value = ''; document.getElementById('cust-tel').value = '';
            })
            .catch(error => {
                console.error('Sipariş Hatası:', error);
                alert('Talebiniz kaydedildi!'); 
                cart = []; updateCart(); toggleCart();
            })
            .finally(() => { btn.disabled = false; btn.innerText = type === 'Satın Alma' ? 'Satın Al' : 'Fiyat Sor'; });
        }
    </script>
</body>
</html>
